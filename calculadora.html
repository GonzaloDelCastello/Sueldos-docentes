<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Redirigiendo...</title>
    
    <!-- 1. El Taxi HTML: Redirige instantáneamente (en 0 segundos) a la raíz del sitio (index) -->
    <meta http-equiv="refresh" content="0; url=/">
    
    <!-- 2. El Taxi JavaScript: Respaldo por si el navegador del usuario bloquea la etiqueta meta -->
    <script>
        // Usamos replace() en lugar de href para que el usuario no pueda volver atrás a esta página vacía
        window.location.replace("/");
    </script>
</head>
<body style="background-color: var(--primarioClaro); text-align: center; padding-top: 20%; font-family: sans-serif;">
    <p>Redirigiendo a la página principal de la Calculadora...</p>
</body>
</html>
